[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dev-agent"
version = "0.1.0"
description = "Local, review-first development orchestration with Codex CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dev-agent = "dev_agent.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_agent"]
